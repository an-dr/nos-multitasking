name: Build APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk nos-multitasking.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nos-multitasking-apk
          path: nos-multitasking.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" nos-multitasking.apk \
            --title "APK build ${GITHUB_RUN_NUMBER}" \
            --notes "Debug-signed APK from commit ${GITHUB_SHA}" \
            --target "$GITHUB_SHA"
