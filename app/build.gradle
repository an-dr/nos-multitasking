plugins {
    id 'com.android.application'
}

android {
    namespace 'me.agramakov.nosmultitasking'
    compileSdk 36

    defaultConfig {
        applicationId 'me.agramakov.nosmultitasking'
        minSdk 34
        targetSdk 36
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0'
    }

    signingConfigs {
        fixed {
            storeFile file('release.keystore')
            storePassword 'nosmulti'
            keyAlias 'nos'
            keyPassword 'nosmulti'
        }
    }

    buildTypes {
        // Signed with a fixed key committed to the repo so updates install over each other.
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
